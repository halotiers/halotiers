<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Halo Tiers | Rankings</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg-color: #050507;
      --card-bg: linear-gradient(180deg, #10121a 0%, #08090d 100%);
      --card-border: rgba(255, 255, 255, 0.07);
      --inner-bg: #0b0d13;
      --text-main: #f8fafc;
      --text-muted: #64748b;
      --accent-purple: #8a2be2;
      
      --t1-glow: rgba(234, 179, 8, 0.15);
      --t2-glow: rgba(148, 163, 184, 0.15);
      --t3-glow: rgba(217, 119, 6, 0.15);
      --t4-glow: rgba(56, 189, 248, 0.1);
      --t5-glow: rgba(129, 140, 248, 0.1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', system-ui, -apple-system, sans-serif; }

    body {
      background: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      padding: 2.5rem 1.5rem;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 1250px;
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
    }

    .header-panel {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 2rem 1.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      box-shadow: 0 15px 30px rgba(0,0,0,0.5);
    }

    .logo-container {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      overflow: hidden;
      border: 2px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.08);
      margin-bottom: 0.8rem;
      background: #000;
    }

    .logo-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .header-sub { 
      font-size: 0.7rem; 
      font-weight: 800; 
      letter-spacing: 2px; 
      color: var(--text-muted); 
      text-transform: uppercase; 
    }

    .header-title { 
      font-size: 2.2rem; 
      font-weight: 900; 
      margin-top: 0.2rem; 
      letter-spacing: -0.5px; 
      color: #ffffff;
    }

    .stat-pill {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 0.4rem 1rem;
      margin-top: 1rem;
      font-size: 0.75rem;
      font-weight: 800;
      color: var(--text-muted);
      letter-spacing: 0.5px;
    }

    .stat-pill span { color: #fff; font-weight: 900; }

    .nav-panel {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 0.5rem 0.8rem;
      display: flex;
      justify-content: center;
      gap: 0.4rem;
      overflow-x: auto;
    }

    .nav-tab {
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-muted);
      padding: 0.55rem 1.1rem;
      border-radius: 10px;
      font-weight: 800;
      font-size: 0.8rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      transition: all 0.2s ease;
      text-transform: uppercase;
    }

    .nav-tab img { width: 16px; height: 16px; object-fit: contain; }
    .nav-tab.active { background: rgba(255, 255, 255, 0.06); border-color: var(--card-border); color: #fff; }
    .nav-tab:hover:not(.active) { color: #fff; background: rgba(255, 255, 255, 0.02); }

    .content-panel {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 1.8rem;
    }

    .panel-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
      padding-bottom: 0.8rem;
      border-bottom: 1px solid var(--card-border);
    }

    .panel-title { font-size: 1.2rem; font-weight: 800; }
    
    .status-badge { 
      background: rgba(138, 43, 226, 0.12); 
      padding: 0.4rem 0.8rem; 
      border-radius: 6px; 
      font-weight: 800; 
      font-size: 0.75rem; 
      color: #a855f7;
      border: 1px solid rgba(138, 43, 226, 0.3);
      letter-spacing: 0.5px;
    }

    .leaderboard-table { width: 100%; border-collapse: separate; border-spacing: 0 0.4rem; }
    .leaderboard-table th { padding: 0.6rem 1rem; font-size: 0.7rem; text-transform: uppercase; color: var(--text-muted); font-weight: 800; text-align: left; }
    
    .lb-row { background: var(--inner-bg); border-radius: 8px; }
    .lb-row td { padding: 0.8rem 1rem; vertical-align: middle; }
    .lb-row td:first-child { border-top-left-radius: 8px; border-bottom-left-radius: 8px; }
    .lb-row td:last-child { border-top-right-radius: 8px; border-bottom-right-radius: 8px; }

    .rank-num {
      width: 34px; height: 34px; border-radius: 6px; display: flex; align-items: center; justify-content: center;
      font-weight: 900; font-size: 1rem; background: rgba(255, 255, 255, 0.04); color: #fff;
    }
    .rank-1 { background: #eab308; color: #000; }
    .rank-2 { background: #94a3b8; color: #000; }
    .rank-3 { background: #d97706; color: #fff; }

    .player-meta { display: flex; align-items: center; gap: 0.8rem; }
    .player-avatar { width: 36px; height: 36px; border-radius: 6px; border: 1px solid var(--card-border); }
    .player-name { font-weight: 800; font-size: 0.95rem; color: #fff; }
    .player-pts { font-size: 0.75rem; color: var(--text-muted); font-weight: 600; }

    .region-badge {
      background: rgba(34, 197, 94, 0.12); color: #4ade80; border: 1px solid rgba(34, 197, 94, 0.25);
      padding: 0.2rem 0.5rem; border-radius: 4px; font-weight: 800; font-size: 0.7rem;
    }

    .tier-chips-grid { display: flex; gap: 0.4rem; align-items: center; }
    .chip {
      background: rgba(255, 255, 255, 0.03); border: 1px solid var(--card-border); border-radius: 6px;
      padding: 0.3rem 0.5rem; display: flex; align-items: center; gap: 0.3rem; font-size: 0.7rem; font-weight: 800;
    }
    .chip img { width: 13px; height: 13px; }
    .chip-empty { width: 28px; height: 28px; border-radius: 50%; border: 1px dashed rgba(255, 255, 255, 0.08); display: flex; align-items: center; justify-content: center; color: var(--text-muted); font-size: 0.7rem; }

    .tier-columns-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 0.8rem; }
    .tier-col { background: var(--inner-bg); border-radius: 12px; border: 1px solid var(--card-border); padding: 0.8rem; min-height: 400px; }
    
    .col-header {
      padding: 0.7rem; border-radius: 8px; text-align: center; font-weight: 900; font-size: 1rem;
      margin-bottom: 0.8rem; display: flex; align-items: center; justify-content: center; gap: 0.5rem;
    }
    .col-header img { width: 22px; height: 22px; }
    
    .col-t1 { background: var(--t1-glow); color: #eab308; border: 1px solid #eab308; }
    .col-t2 { background: var(--t2-glow); color: #94a3b8; border: 1px solid #94a3b8; }
    .col-t3 { background: var(--t3-glow); color: #d97706; border: 1px solid #d97706; }
    .col-t4 { background: var(--t4-glow); color: #38bdf8; border: 1px solid rgba(56, 189, 248, 0.4); }
    .col-t5 { background: var(--t5-glow); color: #818cf8; border: 1px solid rgba(129, 140, 248, 0.4); }

    .player-card {
      background: rgba(255, 255, 255, 0.02); border: 1px solid var(--card-border); border-radius: 6px;
      padding: 0.5rem 0.7rem; display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.4rem;
    }
    .player-card-left { display: flex; align-items: center; gap: 0.5rem; }
    .player-card-left img { width: 24px; height: 24px; border-radius: 4px; }
    .player-card-name { font-weight: 700; font-size: 0.8rem; max-width: 95px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .caret-box { font-weight: 900; font-size: 0.85rem; letter-spacing: -1px; }
    .card-ht { border-left: 3px solid #38bdf8; }
    .card-ht .caret-box { color: #38bdf8; }
    .card-lt { border-left: 3px solid #64748b; opacity: 0.8; }
    .card-lt .caret-box { color: #94a3b8; }

    .empty-col-msg { text-align: center; color: var(--text-muted); font-size: 0.75rem; font-weight: 700; padding: 2rem 0; text-transform: uppercase; }
  </style>
</head>
<body>

  <div class="container">
    <div class="header-panel">
      <div class="logo-container">
        <img src="logo.png" alt="Halo Tiers Logo" onerror="this.src='https://mc-heads.net/avatar/MSTEVE/80'">
      </div>
      <div class="header-sub">HALO TIERS NETWORK</div>
      <div class="header-title">Overall Rankings</div>
      
      <div class="stat-pill">
        LISTED PLAYERS: <span id="playerCount">0</span>
      </div>
    </div>

    <div class="nav-panel">
      <button class="nav-tab active" onclick="switchView('overall', this)">
        <i class="fa-solid fa-trophy" style="color: #eab308;"></i> OVERALL
      </button>
      <button class="nav-tab" onclick="switchView('vanilla', this)">
        <img src="https://solacetiers.com/static/tier_icons/vanilla.png" alt="Vanilla"> VANILLA
      </button>
      <button class="nav-tab" onclick="switchView('sword', this)">
        <img src="https://solacetiers.com/static/tier_icons/sword.png" alt="Sword"> SWORD
      </button>
      <button class="nav-tab" onclick="switchView('pot', this)">
        <img src="https://solacetiers.com/static/tier_icons/pot.png" alt="Pot"> POT
      </button>
      <button class="nav-tab" onclick="switchView('uhc', this)">
        <img src="https://solacetiers.com/static/tier_icons/uhc.png" alt="UHC"> UHC
      </button>
      <button class="nav-tab" onclick="switchView('nethpot', this)">
        <img src="https://solacetiers.com/static/tier_icons/netherite.png" alt="Nethpot"> NETHPOT
      </button>
      <button class="nav-tab" onclick="switchView('smp', this)">
        <img src="https://solacetiers.com/static/tier_icons/smp.png" alt="SMP"> SMP
      </button>
      <button class="nav-tab" onclick="switchView('axe', this)">
        <img src="https://solacetiers.com/static/tier_icons/axe.png" alt="Axe"> AXE
      </button>
      <button class="nav-tab" onclick="switchView('mace', this)">
        <i class="fa-solid fa-hammer" style="color: #94a3b8;"></i> MACE
      </button>
    </div>

    <div class="content-panel">
      <div class="panel-top">
        <div class="panel-title" id="panelTitle">Top 100 overall players</div>
        <div class="status-badge">STATUS: ONLINE</div>
      </div>

      <div id="overallView">
        <table class="leaderboard-table">
          <thead>
            <tr>
              <th style="width: 40px;">#</th>
              <th>PLAYER</th>
              <th>REGION</th>
              <th>TIERS</th>
            </tr>
          </thead>
          <tbody id="overallRows"></tbody>
        </table>
      </div>

      <div id="gamemodeView" class="tier-columns-grid" style="display: none;"></div>
    </div>
  </div>

  <script>
    // Live PandaStack API Endpoint
    const BOT_API_URL = 'https://577bc9b4-3507-4d19-b420-d50a8f662a6b.pandastack.ai/api/sync';
    let globalPlayerData = [];

    const POINT_VALUES = {
      'HT1': 60, 'LT1': 45,
      'HT2': 30, 'LT2': 20,
      'HT3': 10, 'LT3': 6,
      'HT4': 4,  'LT4': 3,
      'HT5': 2,  'LT5': 1
    };

    function calculatePoints(tierString) {
      if (!tierString) return 0;
      const formattedTier = tierString.trim().toUpperCase();
      return POINT_VALUES[formattedTier] || 0;
    }

    function calculateTotalPoints(tiersList) {
      if (!Array.isArray(tiersList)) return 0;
      return tiersList.reduce((sum, item) => sum + calculatePoints(item.tier), 0);
    }

    async function fetchWispyByteData() {
      try {
        const res = await fetch(BOT_API_URL);
        const json = await res.json();
        
        // Extract player payload object
        const data = json.data || json;

        globalPlayerData = Object.entries(data).map(([id, p]) => {
          const tierVal = typeof p === 'string' ? p : (p.tier || 'LT5');
          const modeVal = p.mode || 'vanilla';
          const tiersList = p.tiersList || [{ mode: modeVal, tier: tierVal }];
          const totalPts = p.points !== undefined ? p.points : calculateTotalPoints(tiersList);

          return {
            name: p.username || id,
            pts: totalPts,
            region: p.region || 'NA',
            tier: tierVal,
            mode: modeVal,
            tiersList: tiersList
          };
        });

        globalPlayerData.sort((a, b) => b.pts - a.pts);

        document.getElementById('playerCount').innerText = globalPlayerData.length.toLocaleString();
        renderOverall();
      } catch (err) {
        console.error('API Error:', err);
        document.getElementById('overallRows').innerHTML = `
          <tr>
            <td colspan="4" style="text-align:center; padding: 2.5rem; color: var(--text-muted); font-weight: 700;">
              No player data available. Connect your Discord bot to sync data.
            </td>
          </tr>
        `;
      }
    }

    function renderOverall() {
      const tbody = document.getElementById('overallRows');
      tbody.innerHTML = '';

      if (globalPlayerData.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="4" style="text-align:center; padding: 2.5rem; color: var(--text-muted); font-weight: 700;">
              No player data available.
            </td>
          </tr>
        `;
        return;
      }

      const top100 = globalPlayerData.slice(0, 100);

      top100.forEach((player, idx) => {
        const rank = idx + 1;
        const rClass = rank === 1 ? 'rank-1' : rank === 2 ? 'rank-2' : rank === 3 ? 'rank-3' : '';

        let chipsHtml = player.tiersList.map(t => `
          <div class="chip">
            <img src="https://solacetiers.com/static/tier_icons/${t.mode}.png" onerror="this.style.display='none'">
            <span>${t.tier}</span>
          </div>
        `).join('');

        if (player.tiersList.length < 7) {
          chipsHtml += '<div class="chip-empty">-</div>'.repeat(7 - player.tiersList.length);
        }

        tbody.innerHTML += `
          <tr class="lb-row">
            <td><div class="rank-num ${rClass}">${rank}</div></td>
            <td>
              <div class="player-meta">
                <img src="https://mc-heads.net/avatar/${player.name}/36" class="player-avatar" onerror="this.src='https://mc-heads.net/avatar/MSTEVE/36'">
                <div>
                  <div class="player-name">${player.name}</div>
                  <div class="player-pts">• ${player.pts} points</div>
                </div>
              </div>
            </td>
            <td><span class="region-badge">${player.region}</span></td>
            <td><div class="tier-chips-grid">${chipsHtml}</div></td>
          </tr>
        `;
      });
    }

    function renderGamemodeColumns(modeName) {
      const grid = document.getElementById('gamemodeView');
      grid.innerHTML = '';

      const tierHeaders = [
        { title: 'Tier 1', class: 'col-t1', icon: 'https://solacetiers.com/static/icons/tier_1.png' },
        { title: 'Tier 2', class: 'col-t2', icon: 'https://solacetiers.com/static/icons/tier_2.png' },
        { title: 'Tier 3', class: 'col-t3', icon: 'https://solacetiers.com/static/icons/tier_3.png' },
        { title: 'Tier 4', class: 'col-t4', icon: null },
        { title: 'Tier 5', class: 'col-t5', icon: null }
      ];

      const modePlayers = globalPlayerData.filter(p => p.mode.toLowerCase() === modeName.toLowerCase());

      tierHeaders.forEach((t, idx) => {
        const colNum = idx + 1;
        let iconMarkup = t.icon ? `<img src="${t.icon}" alt="T${colNum}">` : '';
        
        const colPlayers = modePlayers.filter(p => p.tier.includes(colNum.toString()));

        let cardsHtml = '';
        if (colPlayers.length === 0) {
          cardsHtml = `<div class="empty-col-msg">No Players</div>`;
        } else {
          colPlayers.forEach(player => {
            const isHT = player.tier.toUpperCase().startsWith('HT'); 
            const caretSymbol = isHT ? '^^' : '^';
            const cardStyleClass = isHT ? 'card-ht' : 'card-lt';

            cardsHtml += `
              <div class="player-card ${cardStyleClass}">
                <div class="player-card-left">
                  <img src="https://mc-heads.net/avatar/${player.name}/24" onerror="this.src='https://mc-heads.net/avatar/MSTEVE/24'">
                  <span class="player-card-name">${player.name}</span>
                </div>
                <div class="caret-box">${caretSymbol}</div>
              </div>
            `;
          });
        }

        grid.innerHTML += `
          <div class="tier-col">
            <div class="col-header ${t.class}">
              ${iconMarkup}
              <span>${t.title}</span>
            </div>
            ${cardsHtml}
          </div>
        `;
      });
    }

    function switchView(mode, tabElem) {
      document.querySelectorAll('.nav-tab').forEach(btn => btn.classList.remove('active'));
      tabElem.classList.add('active');

      const title = document.getElementById('panelTitle');
      const overall = document.getElementById('overallView');
      const gamemode = document.getElementById('gamemodeView');

      if (mode === 'overall') {
        title.innerText = 'Top 100 overall players';
        overall.style.display = 'block';
        gamemode.style.display = 'none';
        renderOverall();
      } else {
        title.innerText = `${mode.toUpperCase()} Tiers Leaderboard`;
        overall.style.display = 'none';
        gamemode.style.display = 'grid';
        renderGamemodeColumns(mode);
      }
    }

    fetchWispyByteData();
  </script>
</body>
</html>
