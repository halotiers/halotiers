<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Halo Tiers Network | Tierlist & Rankings</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #08090c;
      --bg-panel: #0e1117;
      --bg-card: #151921;
      --bg-card-hover: #1c222e;
      --border-color: rgba(255, 255, 255, 0.08);
      --border-accent: rgba(255, 255, 255, 0.15);
      
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --accent-purple: #9333ea;
      
      --t1-color: #f59e0b;
      --t2-color: #94a3b8;
      --t3-color: #d97706;
      --t4-color: #38bdf8;
      --t5-color: #a855f7;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }

    body {
      background: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-bottom: 3rem;
    }

    /* Pixelated avatar rendering (Fixes blurry Steve/Skin faces) */
    .pixelated {
      image-rendering: pixelated;
      image-rendering: -moz-crisp-edges;
      image-rendering: crisp-edges;
    }

    /* Navigation Bar */
    .navbar {
      width: 100%;
      background: var(--bg-panel);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .navbar-container {
      width: 100%;
      max-width: 1300px;
      padding: 0.75rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      text-decoration: none;
      color: #fff;
    }

    .brand-logo {
      width: 38px;
      height: 38px;
      border-radius: 8px;
      border: 1px solid var(--border-accent);
      object-fit: cover;
    }

    .brand-text {
      font-weight: 900;
      font-size: 1.1rem;
      letter-spacing: -0.5px;
      text-transform: uppercase;
      background: linear-gradient(135deg, #fff 0%, #a5b4fc 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .nav-links {
      display: flex;
      gap: 0.3rem;
      overflow-x: auto;
    }

    .nav-tab {
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-muted);
      padding: 0.5rem 0.85rem;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.8rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      transition: all 0.15s ease;
      white-space: nowrap;
    }

    .nav-tab img { width: 16px; height: 16px; object-fit: contain; }
    .nav-tab.active { background: rgba(255, 255, 255, 0.08); border-color: var(--border-accent); color: #fff; }
    .nav-tab:hover:not(.active) { color: #fff; background: rgba(255, 255, 255, 0.04); }

    /* Main Container */
    .main-container {
      width: 100%;
      max-width: 1300px;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
    }

    /* Subheader & Stats Toolbar */
    .sub-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--bg-panel);
      border: 1px solid var(--border-color);
      padding: 1rem 1.5rem;
      border-radius: 12px;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .page-info {
      display: flex;
      align-items: center;
      gap: 0.8rem;
    }

    .page-title {
      font-size: 1.25rem;
      font-weight: 800;
      color: #fff;
    }

    .badge-status {
      background: rgba(34, 197, 94, 0.1);
      border: 1px solid rgba(34, 197, 94, 0.25);
      color: #4ade80;
      font-size: 0.7rem;
      font-weight: 800;
      padding: 0.25rem 0.6rem;
      border-radius: 6px;
      letter-spacing: 0.5px;
    }

    .search-box {
      position: relative;
      width: 240px;
    }

    .search-box i {
      position: absolute;
      left: 0.8rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 0.85rem;
    }

    .search-input {
      width: 100%;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      padding: 0.45rem 0.8rem 0.45rem 2.2rem;
      border-radius: 8px;
      color: #fff;
      font-size: 0.8rem;
      font-weight: 600;
      outline: none;
      transition: border-color 0.15s ease;
    }

    .search-input:focus {
      border-color: var(--accent-purple);
    }

    /* Gamemode Tier Grid (5 Columns) */
    .tier-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 0.75rem;
    }

    @media (max-width: 1024px) {
      .tier-grid { grid-template-columns: repeat(3, 1fr); }
    }
    @media (max-width: 640px) {
      .tier-grid { grid-template-columns: 1fr; }
    }

    .tier-column {
      background: var(--bg-panel);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 0.6rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      min-height: 500px;
    }

    .tier-header {
      padding: 0.6rem;
      border-radius: 6px;
      font-weight: 800;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-color);
    }

    .tier-header.t1 { color: var(--t1-color); border-color: rgba(245, 158, 11, 0.3); background: rgba(245, 158, 11, 0.08); }
    .tier-header.t2 { color: var(--t2-color); border-color: rgba(148, 163, 184, 0.3); background: rgba(148, 163, 184, 0.08); }
    .tier-header.t3 { color: var(--t3-color); border-color: rgba(217, 119, 6, 0.3); background: rgba(217, 119, 6, 0.08); }
    .tier-header.t4 { color: var(--t4-color); border-color: rgba(56, 189, 248, 0.3); background: rgba(56, 189, 248, 0.08); }
    .tier-header.t5 { color: var(--t5-color); border-color: rgba(168, 85, 247, 0.3); background: rgba(168, 85, 247, 0.08); }

    /* Player Cards inside Tier Columns */
    .player-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 0.45rem 0.6rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: background 0.15s ease, transform 0.1s ease;
    }

    .player-card:hover {
      background: var(--bg-card-hover);
      border-color: var(--border-accent);
      transform: translateY(-1px);
    }

    .player-info {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      overflow: hidden;
    }

    .player-head {
      width: 26px;
      height: 26px;
      border-radius: 4px;
      background: #000;
      flex-shrink: 0;
    }

    .player-name {
      font-size: 0.8rem;
      font-weight: 700;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .tier-tag {
      font-size: 0.7rem;
      font-weight: 900;
      padding: 0.15rem 0.35rem;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.05);
      letter-spacing: -0.5px;
    }

    .tag-ht { color: #38bdf8; background: rgba(56, 189, 248, 0.12); }
    .tag-lt { color: #94a3b8; background: rgba(148, 163, 184, 0.1); }

    .empty-msg {
      text-align: center;
      color: var(--text-muted);
      font-size: 0.75rem;
      font-weight: 600;
      padding: 2rem 0;
    }

    /* Overall Table View */
    .table-wrapper {
      background: var(--bg-panel);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 1rem;
      overflow-x: auto;
    }

    .mct-table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    .mct-table th {
      padding: 0.75rem 1rem;
      font-size: 0.7rem;
      font-weight: 800;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border-bottom: 1px solid var(--border-color);
    }

    .mct-table td {
      padding: 0.7rem 1rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.03);
      vertical-align: middle;
    }

    .mct-table tr:last-child td { border-bottom: none; }

    .mct-table tr:hover td {
      background: rgba(255, 255, 255, 0.02);
    }

    .rank-num {
      font-weight: 900;
      font-size: 0.85rem;
      width: 28px;
      height: 28px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.05);
    }

    .rank-1 { background: #f59e0b; color: #000; }
    .rank-2 { background: #94a3b8; color: #000; }
    .rank-3 { background: #d97706; color: #fff; }

    .player-cell {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .player-cell img {
      width: 32px;
      height: 32px;
      border-radius: 6px;
    }

    .player-cell-name {
      font-weight: 700;
      font-size: 0.85rem;
      color: #fff;
    }

    .player-cell-pts {
      font-size: 0.7rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    .region-pill {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-color);
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      font-size: 0.7rem;
      font-weight: 800;
      color: #34d399;
    }

    .tier-badges {
      display: flex;
      gap: 0.35rem;
      flex-wrap: wrap;
    }

    .chip-badge {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      padding: 0.2rem 0.45rem;
      border-radius: 4px;
      font-size: 0.68rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 0.3rem;
    }

    .chip-badge img { width: 12px; height: 12px; }
  </style>
</head>
<body>

  <!-- Top Navbar -->
  <nav class="navbar">
    <div class="navbar-container">
      <a href="#" class="brand">
        <img src="logo.png" alt="Logo" class="brand-logo" onerror="this.src='https://mc-heads.net/avatar/MSTEVE/64'">
        <span class="brand-text" id="guildSubTitle">Halo Tiers Network</span>
      </a>

      <div class="nav-links">
        <button class="nav-tab active" onclick="switchView('overall', this)">
          <i class="fa-solid fa-trophy" style="color: #f59e0b;"></i> OVERALL
        </button>
        <button class="nav-tab" onclick="switchView('vanilla', this)">
          <img src="https://solacetiers.com/static/tier_icons/vanilla.png" alt="Vanilla"> VANILLA
        </button>
        <button class="nav-tab" onclick="switchView('sword', this)">
          <img src="https://solacetiers.com/static/tier_icons/sword.png" alt="Sword"> SWORD
        </button>
        <button class="nav-tab" onclick="switchView('pot', this)">
          <img src="https://solacetiers.com/static/tier_icons/pot.png" alt="Pot"> POT
        </button>
        <button class="nav-tab" onclick="switchView('uhc', this)">
          <img src="https://solacetiers.com/static/tier_icons/uhc.png" alt="UHC"> UHC
        </button>
        <button class="nav-tab" onclick="switchView('nethpot', this)">
          <img src="https://solacetiers.com/static/tier_icons/netherite.png" alt="Nethpot"> NETHPOT
        </button>
        <button class="nav-tab" onclick="switchView('smp', this)">
          <img src="https://solacetiers.com/static/tier_icons/smp.png" alt="SMP"> SMP
        </button>
        <button class="nav-tab" onclick="switchView('axe', this)">
          <img src="https://solacetiers.com/static/tier_icons/axe.png" alt="Axe"> AXE
        </button>
        <button class="nav-tab" onclick="switchView('mace', this)">
          <i class="fa-solid fa-hammer" style="color: #94a3b8;"></i> MACE
        </button>
      </div>
    </div>
  </nav>

  <!-- Main Content Wrapper -->
  <div class="main-container">

    <!-- Sub-header bar with titles and search -->
    <div class="sub-toolbar">
      <div class="page-info">
        <div class="page-title" id="panelTitle">Overall Rankings</div>
        <div class="badge-status" id="statusBadge">ONLINE</div>
      </div>

      <div class="search-box">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" id="searchInput" class="search-input" placeholder="Search player..." oninput="handleSearch()">
      </div>
    </div>

    <!-- Overall View -->
    <div id="overallView" class="table-wrapper">
      <table class="mct-table">
        <thead>
          <tr>
            <th style="width: 40px;">#</th>
            <th>Player</th>
            <th>Region</th>
            <th>Tiers</th>
          </tr>
        </thead>
        <tbody id="overallRows"></tbody>
      </table>
    </div>

    <!-- Gamemode View (5 Columns) -->
    <div id="gamemodeView" class="tier-grid" style="display: none;"></div>

  </div>

  <script>
    const BOT_API_URL = 'https://api.allorigins.win/raw?url=' + encodeURIComponent('https://halotiers.wispbyte.app/api/tiers');
    let globalPlayerData = [];
    let currentMode = 'overall';

    const POINT_VALUES = {
      'HT1': 60, 'LT1': 45,
      'HT2': 30, 'LT2': 20,
      'HT3': 10, 'LT3': 6,
      'HT4': 4,  'LT4': 3,
      'HT5': 2,  'LT5': 1
    };

    function calculatePoints(tierString) {
      if (!tierString) return 0;
      return POINT_VALUES[tierString.trim().toUpperCase()] || 0;
    }

    function calculateTotalPoints(tiersList) {
      if (!Array.isArray(tiersList)) return 0;
      return tiersList.reduce((sum, item) => sum + calculatePoints(item.tier), 0);
    }

    async function fetchWispyByteData() {
      try {
        const res = await fetch(BOT_API_URL);
        const json = await res.json();

        if (json.guild) {
          document.getElementById('guildSubTitle').innerText = json.guild.toUpperCase();
        }

        const rawPlayers = json.players || json.data || json;

        if (Array.isArray(rawPlayers)) {
          globalPlayerData = rawPlayers.map(p => {
            const tierVal = p.tier || 'LT5';
            const modeVal = p.mode || 'vanilla';
            const tiersList = p.tiersList || [{ mode: modeVal, tier: tierVal }];
            const totalPts = p.pts !== undefined ? p.pts : calculateTotalPoints(tiersList);

            return {
              name: p.ign || p.discord || 'Unknown',
              pts: totalPts,
              region: p.region || 'NA',
              tier: tierVal,
              mode: modeVal,
              tiersList: tiersList
            };
          });
        } else {
          globalPlayerData = Object.entries(rawPlayers).map(([id, p]) => {
            const tierVal = typeof p === 'string' ? p : (p.tier || 'LT5');
            const modeVal = p.mode || 'vanilla';
            const tiersList = p.tiersList || [{ mode: modeVal, tier: tierVal }];
            const totalPts = p.points !== undefined ? p.points : calculateTotalPoints(tiersList);

            return {
              name: p.username || p.ign || id,
              pts: totalPts,
              region: p.region || 'NA',
              tier: tierVal,
              mode: modeVal,
              tiersList: tiersList
            };
          });
        }

        globalPlayerData.sort((a, b) => b.pts - a.pts);
        renderCurrentView();

      } catch (err) {
        console.error('API Error:', err);
        const status = document.getElementById('statusBadge');
        status.innerText = 'OFFLINE';
        status.style.color = '#f87171';
        status.style.borderColor = 'rgba(248, 113, 113, 0.3)';
        status.style.background = 'rgba(248, 113, 113, 0.1)';
        
        document.getElementById('overallRows').innerHTML = `
          <tr>
            <td colspan="4" class="empty-msg">Unable to load rankings. Check API status.</td>
          </tr>
        `;
      }
    }

    function renderOverall(filterQuery = '') {
      const tbody = document.getElementById('overallRows');
      tbody.innerHTML = '';

      let filtered = globalPlayerData;
      if (filterQuery) {
        filtered = filtered.filter(p => p.name.toLowerCase().includes(filterQuery.toLowerCase()));
      }

      if (filtered.length === 0) {
        tbody.innerHTML = `<tr><td colspan="4" class="empty-msg">No players found</td></tr>`;
        return;
      }

      filtered.slice(0, 100).forEach((player, idx) => {
        const rank = idx + 1;
        const rClass = rank === 1 ? 'rank-1' : rank === 2 ? 'rank-2' : rank === 3 ? 'rank-3' : '';

        let chipsHtml = player.tiersList.map(t => `
          <div class="chip-badge">
            <img src="https://solacetiers.com/static/tier_icons/${t.mode}.png" onerror="this.style.display='none'">
            <span>${t.tier}</span>
          </div>
        `).join('');

        tbody.innerHTML += `
          <tr>
            <td><div class="rank-num ${rClass}">${rank}</div></td>
            <td>
              <div class="player-cell">
                <img class="pixelated" src="https://mc-heads.net/avatar/${player.name}/64" onerror="this.src='https://mc-heads.net/avatar/MSTEVE/64'">
                <div>
                  <div class="player-cell-name">${player.name}</div>
                  <div class="player-cell-pts">${player.pts} pts</div>
                </div>
              </div>
            </td>
            <td><span class="region-pill">${player.region}</span></td>
            <td><div class="tier-badges">${chipsHtml}</div></td>
          </tr>
        `;
      });
    }

    function renderGamemodeColumns(modeName, filterQuery = '') {
      const grid = document.getElementById('gamemodeView');
      grid.innerHTML = '';

      const tierHeaders = [
        { title: 'Tier 1', class: 't1' },
        { title: 'Tier 2', class: 't2' },
        { title: 'Tier 3', class: 't3' },
        { title: 'Tier 4', class: 't4' },
        { title: 'Tier 5', class: 't5' }
      ];

      let modePlayers = globalPlayerData.filter(p => p.mode.toLowerCase() === modeName.toLowerCase());
      if (filterQuery) {
        modePlayers = modePlayers.filter(p => p.name.toLowerCase().includes(filterQuery.toLowerCase()));
      }

      tierHeaders.forEach((t, idx) => {
        const colNum = idx + 1;
        const colPlayers = modePlayers.filter(p => p.tier.includes(colNum.toString()));

        let cardsHtml = '';
        if (colPlayers.length === 0) {
          cardsHtml = `<div class="empty-msg">No Players</div>`;
        } else {
          colPlayers.forEach(player => {
            const isHT = player.tier.toUpperCase().startsWith('HT');
            const tagClass = isHT ? 'tag-ht' : 'tag-lt';

            cardsHtml += `
              <div class="player-card">
                <div class="player-info">
                  <img class="player-head pixelated" src="https://mc-heads.net/avatar/${player.name}/64" onerror="this.src='https://mc-heads.net/avatar/MSTEVE/64'">
                  <span class="player-name">${player.name}</span>
                </div>
                <span class="tier-tag ${tagClass}">${player.tier}</span>
              </div>
            `;
          });
        }

        grid.innerHTML += `
          <div class="tier-column">
            <div class="tier-header ${t.class}">${t.title}</div>
            ${cardsHtml}
          </div>
        `;
      });
    }

    function switchView(mode, tabElem) {
      document.querySelectorAll('.nav-tab').forEach(btn => btn.classList.remove('active'));
      tabElem.classList.add('active');

      currentMode = mode;
      document.getElementById('searchInput').value = '';
      
      const title = document.getElementById('panelTitle');
      const overall = document.getElementById('overallView');
      const gamemode = document.getElementById('gamemodeView');

      if (mode === 'overall') {
        title.innerText = 'Overall Leaderboard';
        overall.style.display = 'block';
        gamemode.style.display = 'none';
      } else {
        title.innerText = `${mode.toUpperCase()} Leaderboard`;
        overall.style.display = 'none';
        gamemode.style.display = 'grid';
      }

      renderCurrentView();
    }

    function renderCurrentView() {
      const query = document.getElementById('searchInput').value.trim();
      if (currentMode === 'overall') {
        renderOverall(query);
      } else {
        renderGamemodeColumns(currentMode, query);
      }
    }

    function handleSearch() {
      renderCurrentView();
    }

    fetchWispyByteData();
  </script>
</body>
</html>
