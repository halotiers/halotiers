<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Halo Tiers Network</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap"
rel="stylesheet">

<style>

:root {

    --bg: #0c1219;
    --bg-dark: #090e14;
    --panel: #111821;
    --panel-2: #151e28;

    --border: #202b37;
    --border-light: #263442;

    --text: #f1f5f9;
    --muted: #697789;

    --accent: #ffffff;

    --t1: #ffc72c;
    --t2: #aeb8c4;
    --t3: #c46c26;
    --t4: #62b7eb;
    --t5: #a978d0;

}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: 'Plus Jakarta Sans', sans-serif;
}

body {

    min-height: 100vh;

    background:
        radial-gradient(
            circle at 50% -20%,
            rgba(93,65,130,.13),
            transparent 45%
        ),
        #0b1118;

    color: var(--text);

    padding-bottom: 80px;
}


/* =========================================================
   TOP NAVIGATION
========================================================= */

.nav-wrapper {

    width: 100%;

    padding-top: 30px;
}

.navbar {

    width: min(1315px, calc(100% - 40px));

    height: 62px;

    margin: auto;

    background: #121922;

    border: 1px solid #1d2935;

    border-radius: 15px;

    display: flex;

    align-items: center;

    padding: 0 16px;

    box-shadow:
        0 8px 25px rgba(0,0,0,.18);

}


/* LOGO */

.brand {

    display: flex;

    align-items: center;

    width: 270px;

    text-decoration: none;
}

.brand-logo {

    width: 155px;

    height: auto;

    object-fit: contain;
}

.brand-name {
    display: none;
}


/* NAV */

.main-nav {

    display: flex;

    align-items: center;

    gap: 26px;

    flex: 1;

    height: 100%;
}

.main-nav a {

    height: 100%;

    display: flex;

    align-items: center;

    gap: 8px;

    color: #687487;

    text-decoration: none;

    font-size: 15px;

    font-weight: 600;

    transition: .15s;
}

.main-nav a:hover {
    color: white;
}

.main-nav a.active {
    color: white;
}

.main-nav i {
    font-size: 18px;
}


/* SEARCH */

.nav-search {

    width: 220px;

    height: 38px;

    border-radius: 22px;

    background: #192330;

    border: 1px solid #202d3a;

    display: flex;

    align-items: center;

    padding: 0 13px;

    gap: 9px;

    color: #647386;
}

.nav-search input {

    width: 100%;

    border: none;

    outline: none;

    background: transparent;

    color: white;

    font-size: 12px;
}

.nav-search input::placeholder {
    color: #647386;
}


/* =========================================================
   PAGE
========================================================= */

.page {

    width: min(1315px, calc(100% - 40px));

    margin: 50px auto 0;
}


/* =========================================================
   MODE TABS
========================================================= */

.mode-tabs {

    display: grid;

    grid-template-columns:
        repeat(10, 1fr);

    height: 76px;
}

.mode-tab {

    position: relative;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    gap: 6px;

    background: #0e151d;

    border: 1px solid #1b2733;

    border-bottom: none;

    color: #667487;

    cursor: pointer;

    transition: .15s;

    font-size: 13px;

    font-weight: 800;
}

.mode-tab:first-child {
    border-radius: 22px 22px 0 0;
}

.mode-tab:last-child {
    border-radius: 0 22px 0 0;
}

.mode-tab img {

    width: 28px;

    height: 28px;

    object-fit: contain;
}

.mode-tab i {
    font-size: 27px;
}

.mode-tab:hover {
    color: white;
    background: #121b25;
}

.mode-tab.active {

    color: white;

    background: #121b24;

    border-bottom: 3px solid white;
}

.mode-tab.active::after {

    content: "";

    position: absolute;

    bottom: -1px;

    left: 8px;

    right: 8px;

    height: 2px;

    background: white;
}


/* =========================================================
   LEADERBOARD
========================================================= */

.leaderboard {

    background: #111821;

    border: 1px solid #202b37;

    border-radius: 0 14px 14px 14px;

    overflow: hidden;

    box-shadow:
        0 15px 40px rgba(0,0,0,.15);
}


/* =========================================================
   TOP INFO
========================================================= */

.info-bar {

    height: 67px;

    display: flex;

    align-items: center;

    justify-content: flex-end;

    gap: 10px;

    padding: 0 20px;

    border-bottom: 1px solid #1d2833;
}

.info-button {

    height: 35px;

    padding: 0 13px;

    border-radius: 8px;

    background: #202b37;

    color: white;

    border: none;

    font-weight: 800;

    font-size: 12px;
}

.server-label {

    display: flex;

    flex-direction: column;

    gap: 3px;

    font-size: 9px;

    font-weight: 800;

    color: #748195;
}

.server-ip {

    height: 32px;

    display: flex;

    align-items: center;

    gap: 7px;

    padding: 0 9px;

    border-radius: 7px;

    background: #1b2632;

    color: #9caabd;

    font-size: 11px;

    font-weight: 700;
}


/* =========================================================
   TABLE HEADER
========================================================= */

.table-header {

    height: 72px;

    display: grid;

    grid-template-columns:
        150px
        1fr
        80px
        390px;

    align-items: center;

    padding: 0 20px;

    color: #536174;

    font-size: 11px;

    font-weight: 900;

    text-transform: uppercase;
}

.table-header div:nth-child(1) {
    padding-left: 14px;
}


/* =========================================================
   PLAYER ROW
========================================================= */

.player-row {

    position: relative;

    height: 80px;

    margin: 0 12px 9px;

    display: grid;

    grid-template-columns:
        150px
        1fr
        80px
        390px;

    align-items: center;

    background: #151e28;

    border: 1px solid #202c38;

    border-radius: 13px;

    overflow: hidden;

    transition: .15s;
}

.player-row:hover {

    background: #19232e;

    border-color: #2b3a49;

    transform: translateY(-1px);
}


/* =========================================================
   RANK SECTION
========================================================= */

.rank-section {

    position: relative;

    height: 100%;

    overflow: visible;

    display: flex;

    align-items: center;

    padding-left: 13px;
}


/* diagonal shape */

.rank-section::before {

    content: "";

    position: absolute;

    top: 0;

    bottom: 0;

    left: 0;

    width: 155px;

    background: #202b37;

    clip-path: polygon(
        0 0,
        78% 0,
        100% 50%,
        78% 100%,
        0 100%
    );
}


/* TOP THREE */

.rank-1 .rank-section::before {
    background: #f5bd32;
}

.rank-2 .rank-section::before {
    background: #aab6c1;
}

.rank-3 .rank-section::before {
    background: #c46b25;
}


/* RANK NUMBER */

.rank-number {

    position: relative;

    z-index: 5;

    font-size: 34px;

    font-weight: 900;

    font-style: italic;

    color: white;

    width: 62px;

    text-align: center;

    text-shadow: 0 2px 4px rgba(0,0,0,.25);
}


/* =========================================================
   CHARACTER
========================================================= */

.character {

    position: absolute;

    z-index: 10;

    left: 63px;

    bottom: -7px;

    height: 91px;

    width: auto;

    image-rendering: pixelated;

    object-fit: contain;

    filter:
        drop-shadow(
            0 4px 4px rgba(0,0,0,.35)
        );
}


/* =========================================================
   PLAYER INFORMATION
========================================================= */

.player-information {

    padding-left: 3px;

    min-width: 0;
}

.player-name {

    font-size: 20px;

    font-weight: 900;

    color: #dbe5f2;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;
}

.player-subtitle {

    margin-top: 4px;

    font-size: 14px;

    color: #7293b5;

    font-weight: 500;
}

.player-subtitle span {
    color: #496783;
}


/* =========================================================
   REGION
========================================================= */

.region {

    width: 48px;

    height: 40px;

    border-radius: 8px;

    display: flex;

    align-items: center;

    justify-content: center;

    font-size: 14px;

    font-weight: 900;
}

.region.NA {

    color: #ed5964;

    background: rgba(220,70,80,.2);
}

.region.EU {

    color: #55dc69;

    background: rgba(50,190,70,.2);
}

.region.AS {

    color: #62a9ff;

    background: rgba(60,130,240,.18);
}


/* =========================================================
   TIERS
========================================================= */

.tiers {

    height: 100%;

    display: flex;

    align-items: center;

    justify-content: flex-start;

    gap: 8px;

    padding-right: 10px;
}

.tier-item {

    width: 42px;

    display: flex;

    flex-direction: column;

    align-items: center;

    gap: 4px;
}

.tier-icon {

    width: 32px;

    height: 32px;

    border-radius: 50%;

    display: flex;

    align-items: center;

    justify-content: center;

    background: #0c1219;

    border: 2px solid #263442;

    box-shadow:
        0 2px 5px rgba(0,0,0,.3);
}

.tier-icon img {

    width: 20px;

    height: 20px;

    object-fit: contain;
}

.tier-name {

    font-size: 11px;

    font-weight: 900;

    color: #9ba8b7;
}


/* TIER COLORS */

.tier-ht1 .tier-name {
    color: #ffc72c;
}

.tier-lt1 .tier-name {
    color: #aeb8c4;
}

.tier-ht2 .tier-name {
    color: #61b9ed;
}

.tier-lt2 .tier-name {
    color: #8795a6;
}

.tier-ht3 .tier-name {
    color: #d68a3a;
}


/* =========================================================
   EMPTY
========================================================= */

.empty-state {

    padding: 60px;

    text-align: center;

    color: #556274;

    font-size: 13px;

    font-weight: 800;
}


/* =========================================================
   SEARCH
========================================================= */

.search-overlay {

    position: absolute;

    right: 30px;

    top: 30px;

    width: 240px;
}


/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:1100px) {

    .main-nav {
        gap: 12px;
    }

    .brand {
        width: 180px;
    }

    .brand-logo {
        width: 130px;
    }

    .nav-search {
        width: 170px;
    }

    .table-header,
    .player-row {

        grid-template-columns:
            120px
            1fr
            65px
            300px;
    }

    .tiers {
        gap: 3px;
    }

    .tier-item {
        width: 34px;
    }

}


@media(max-width:800px) {

    .navbar {
        height: auto;
        padding: 12px;
        flex-wrap: wrap;
        gap: 10px;
    }

    .brand {
        width: auto;
    }

    .main-nav {
        order: 3;
        width: 100%;
        overflow-x: auto;
    }

    .nav-search {
        margin-left: auto;
    }

    .mode-tabs {
        overflow-x: auto;
        grid-template-columns:
            repeat(10, 95px);
    }

    .table-header {
        display: none;
    }

    .player-row {

        height: 92px;

        grid-template-columns:
            125px
            1fr
            55px;

    }

    .tiers {
        display: none;
    }

    .character {
        height: 100px;
    }

    .player-name {
        font-size: 15px;
    }

    .player-subtitle {
        font-size: 11px;
    }

}

</style>
</head>

<script>


/* =========================================================
   API
========================================================= */

/*
    YOUR API

    If you are using a CORS proxy, change ONLY this URL.
*/

const BOT_API_URL =
    'https://corsproxy.io/?url=' +
    encodeURIComponent(
        'https://halotiers.wispbyte.app/api/tiers'
    );


/*
    If your API has CORS enabled directly,
    use this instead:

    const BOT_API_URL =
        'https://halotiers.wispbyte.app/api/tiers';
*/


let globalPlayerData = [];

let currentMode = 'overall';


/* =========================================================
   POINT VALUES
========================================================= */

const POINT_VALUES = {

    'HT1': 60,
    'LT1': 45,

    'HT2': 30,
    'LT2': 20,

    'HT3': 10,
    'LT3': 6,

    'HT4': 4,
    'LT4': 3,

    'HT5': 2,
    'LT5': 1

};


/* =========================================================
   POINT CALCULATIONS
========================================================= */

function calculatePoints(tierString) {

    if (!tierString)
        return 0;

    return POINT_VALUES[
        tierString
            .trim()
            .toUpperCase()
    ] || 0;

}


function calculateTotalPoints(tiersList) {

    if (!Array.isArray(tiersList))
        return 0;

    return tiersList.reduce(
        (sum, item) =>
            sum + calculatePoints(item.tier),
        0
    );

}


/* =========================================================
   API FETCH
========================================================= */

async function fetchTierData() {

    try {

        const res =
            await fetch(BOT_API_URL);

        if (!res.ok)
            throw new Error(
                `HTTP ${res.status}`
            );

        const json =
            await res.json();


        if (json.guild) {

            document.title =
                json.guild +
                ' Tierlist';

        }


        const rawPlayers =
            json.players ||
            json.data ||
            json;


        /* ===============================================
           ARRAY FORMAT
        =============================================== */

        if (Array.isArray(rawPlayers)) {

            globalPlayerData =
                rawPlayers.map(p => {

                    const tierVal =
                        p.tier || 'LT5';

                    const modeVal =
                        p.mode || 'vanilla';

                    const tiersList =
                        p.tiersList ||
                        [{
                            mode: modeVal,
                            tier: tierVal
                        }];

                    const totalPts =
                        p.pts !== undefined
                            ? p.pts
                            : calculateTotalPoints(
                                tiersList
                            );


                    return {

                        name:
                            p.ign ||
                            p.discord ||
                            p.username ||
                            'Unknown',

                        pts: totalPts,

                        region:
                            p.region ||
                            'NA',

                        tier: tierVal,

                        mode: modeVal,

                        tiersList:
                            tiersList

                    };

                });

        }


        /* ===============================================
           OBJECT FORMAT
        =============================================== */

        else {

            globalPlayerData =
                Object.entries(
                    rawPlayers
                ).map(
                    ([id, p]) => {

                        const tierVal =
                            typeof p === 'string'
                                ? p
                                : (
                                    p.tier ||
                                    'LT5'
                                );

                        const modeVal =
                            p.mode ||
                            'vanilla';

                        const tiersList =
                            p.tiersList ||
                            [{
                                mode: modeVal,
                                tier: tierVal
                            }];

                        const totalPts =
                            p.points !== undefined
                                ? p.points
                                : calculateTotalPoints(
                                    tiersList
                                );


                        return {

                            name:
                                p.username ||
                                p.ign ||
                                id,

                            pts: totalPts,

                            region:
                                p.region ||
                                'NA',

                            tier: tierVal,

                            mode: modeVal,

                            tiersList:
                                tiersList

                        };

                    }
                );

        }


        globalPlayerData.sort(
            (a,b) =>
                b.pts - a.pts
        );


        renderCurrentView();


    } catch(error) {

        console.error(
            'API Load Error:',
            error
        );


        document.getElementById(
            'overallRows'
        ).innerHTML = `

            <div class="empty-state">

                Failed to load tier data.

                <br><br>

                Check your API or CORS proxy.

            </div>

        `;

    }

}


/* =========================================================
   OVERALL
========================================================= */

function renderOverall(
    filterQuery = ''
) {

    const container =
        document.getElementById(
            'overallRows'
        );


    container.innerHTML = '';


    let filtered =
        globalPlayerData;


    if (filterQuery) {

        filtered =
            filtered.filter(
                p =>
                    p.name
                        .toLowerCase()
                        .includes(
                            filterQuery
                                .toLowerCase()
                        )
            );

    }


    if (!filtered.length) {

        container.innerHTML = `

            <div class="empty-state">

                No players found.

            </div>

        `;

        return;

    }


    filtered
        .slice(0,100)
        .forEach(
            (player,index) => {


                const rank =
                    index + 1;


                let rankClass = '';

                if (rank === 1)
                    rankClass = 'rank-1';

                else if (rank === 2)
                    rankClass = 'rank-2';

                else if (rank === 3)
                    rankClass = 'rank-3';


                /*
                    This creates the same
                    character/body position
                    as the screenshot.
                */

                const characterURL =
                    `https://mc-heads.net/body/${encodeURIComponent(player.name)}/100`;


                /*
                    Tier icons
                */

                let tiersHTML = '';


                player.tiersList.forEach(
                    tier => {

                        const tierName =
                            String(
                                tier.tier || 'LT5'
                            ).toUpperCase();


                        const tierClass =
                            tierName
                                .toLowerCase()
                                .replace(
                                    /[^a-z0-9]/g,
                                    ''
                                );


                        tiersHTML += `

                            <div
                                class="tier-item tier-${tierClass}"
                            >

                                <div class="tier-icon">

                                    <img
                                        src="https://solacetiers.com/static/tier_icons/${tier.mode}.png"

                                        onerror="
                                            this.style.display='none'
                                        "
                                    >

                                </div>

                                <div class="tier-name">
                                    ${tierName}
                                </div>

                            </div>

                        `;

                    }
                );


                /*
                    PLAYER ROW
                */

                container.innerHTML += `

                    <div
                        class="
                            player-row
                            ${rankClass}
                        "
                    >

                        <!-- RANK -->

                        <div class="rank-section">

                            <div class="rank-number">
                                ${rank}.
                            </div>

                            <img
                                class="character"
                                src="${characterURL}"

                                onerror="
                                    this.src='https://mc-heads.net/body/MSTEVE/100'
                                "
                            >

                        </div>


                        <!-- PLAYER -->

                        <div class="player-information">

                            <div class="player-name">

                                ${escapeHTML(
                                    player.name
                                )}

                            </div>


                            <div class="player-subtitle">

                                <span>
                                    ✦
                                </span>

                                Combat Master

                                <span>
                                    (${player.pts} points)
                                </span>

                            </div>

                        </div>


                        <!-- REGION -->

                        <div>

                            <div
                                class="
                                    region
                                    ${player.region}
                                "
                            >

                                ${player.region}

                            </div>

                        </div>


                        <!-- TIERS -->

                        <div class="tiers">

                            ${tiersHTML}

                        </div>


                    </div>

                `;

            }
        );

}


/* =========================================================
   GAMEMODE VIEW
========================================================= */

function renderGamemode(
    modeName,
    filterQuery = ''
) {

    const container =
        document.getElementById(
            'gamemodeView'
        );


    container.style.display =
        'block';

    container.innerHTML = '';


    let players =
        globalPlayerData.filter(
            p =>
                p.mode &&
                p.mode.toLowerCase() ===
                modeName.toLowerCase()
        );


    if (filterQuery) {

        players =
            players.filter(
                p =>
                    p.name
                        .toLowerCase()
                        .includes(
                            filterQuery
                                .toLowerCase()
                        )
            );

    }


    const tiers = [
        'Tier 1',
        'Tier 2',
        'Tier 3',
        'Tier 4',
        'Tier 5'
    ];


    tiers.forEach(
        (tierName,index) => {

            const tierNumber =
                index + 1;


            const tierPlayers =
                players.filter(
                    p =>
                        p.tier.includes(
                            String(tierNumber)
                        )
                );


            let html = `

                <div
                    style="
                        margin:20px;
                        padding:20px;
                        background:#151e28;
                        border:1px solid #202c38;
                        border-radius:12px;
                    "
                >

                    <h2
                        style="
                            color:white;
                            margin-bottom:15px;
                        "
                    >
                        ${tierName}
                    </h2>

            `;


            tierPlayers.forEach(
                player => {

                    html += `

                        <div
                            style="
                                padding:10px;
                                margin-bottom:6px;
                                background:#111821;
                                border-radius:7px;
                            "
                        >

                            ${escapeHTML(
                                player.name
                            )}

                            -

                            ${player.tier}

                        </div>

                    `;

                }
            );


            html += `</div>`;


            container.innerHTML +=
                html;

        }
    );

}


/* =========================================================
   SWITCH VIEW
========================================================= */

function switchView(
    mode,
    button
) {

    document
        .querySelectorAll(
            '.mode-tab'
        )
        .forEach(
            btn =>
                btn.classList.remove(
                    'active'
                )
        );


    button.classList.add(
        'active'
    );


    currentMode = mode;


    if (mode === 'overall') {

        document.getElementById(
            'overallRows'
        ).style.display =
            'block';

        document.getElementById(
            'gamemodeView'
        ).style.display =
            'none';

        renderOverall(
            document.getElementById(
                'searchInput'
            ).value
        );

    }

    else {

        document.getElementById(
            'overallRows'
        ).style.display =
            'none';

        document.getElementById(
            'gamemodeView'
        ).style.display =
            'block';

        renderGamemode(
            mode,
            document.getElementById(
                'searchInput'
            ).value
        );

    }

}


/* =========================================================
   SEARCH
========================================================= */

function handleSearch() {

    const query =
        document.getElementById(
            'searchInput'
        ).value.trim();


    if (currentMode === 'overall') {

        renderOverall(query);

    }

    else {

        renderGamemode(
            currentMode,
            query
        );

    }

}


/* =========================================================
   HTML ESCAPE
========================================================= */

function escapeHTML(value) {

    return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');

}


/* =========================================================
   START
========================================================= */

fetchTierData();
